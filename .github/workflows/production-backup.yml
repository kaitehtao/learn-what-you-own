name: Encrypted production backup

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the D1 restore configuration
        run: npm run build
      - name: Link the verified Supabase project
        run: npx supabase link --project-ref fxmdunpolhqponfchwsz --yes
      - name: Create and verify the production backup
        env:
          USE_DOCKER_POSTGRES_CLIENT: "1"
        run: |
          npm run backup:production -- --output "$RUNNER_TEMP/lwyo-backup"
          npm run backup:verify -- "$RUNNER_TEMP/lwyo-backup"
      - name: Start disposable Supabase restore target
        run: |
          mkdir -p "$RUNNER_TEMP/lwyo-supabase-restore"
          npx supabase init --workdir "$RUNNER_TEMP/lwyo-supabase-restore" --yes
          npx supabase start --workdir "$RUNNER_TEMP/lwyo-supabase-restore" --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          container_name="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}')"
          test -n "$container_name"
          test "$(printf '%s\n' "$container_name" | wc -l)" -eq 1
          printf 'SUPABASE_RESTORE_DRILL_CONTAINER=%s\n' "$container_name" >> "$GITHUB_ENV"
      - name: Prove D1 and Supabase can be restored
        run: npm run restore:drill -- "$RUNNER_TEMP/lwyo-backup"
      - name: Encrypt the backup archive
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lwyo-backup.tar.gz" lwyo-backup
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/lwyo-backup.tar.gz" -out "$RUNNER_TEMP/lwyo-backup.tar.gz.enc" -pass env:BACKUP_ENCRYPTION_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: lwyo-encrypted-production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/lwyo-backup.tar.gz.enc
          retention-days: 30
          if-no-files-found: error
      - name: Stop disposable Supabase restore target
        if: always()
        run: npx supabase stop --workdir "$RUNNER_TEMP/lwyo-supabase-restore" --no-backup || true
