name: Encrypted production backup

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Link the verified Supabase project
        run: npx supabase link --project-ref fxmdunpolhqponfchwsz --password "$SUPABASE_DB_PASSWORD"
      - name: Create and verify the production backup
        run: |
          npm run backup:production -- --output "$RUNNER_TEMP/lwyo-backup"
          npm run backup:verify -- "$RUNNER_TEMP/lwyo-backup"
      - name: Encrypt the backup archive
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lwyo-backup.tar.gz" lwyo-backup
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/lwyo-backup.tar.gz" -out "$RUNNER_TEMP/lwyo-backup.tar.gz.enc" -pass env:BACKUP_ENCRYPTION_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: lwyo-encrypted-production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/lwyo-backup.tar.gz.enc
          retention-days: 30
          if-no-files-found: error
