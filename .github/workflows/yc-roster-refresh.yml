name: Refresh Y Combinator roster

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yc-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Discover and enrich the official class roster
        run: npm run yc:update
      - name: Detect a material roster or profile change
        id: changes
        run: |
          if git diff --quiet -- app/data/ycSummer2026.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the changed release
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
      - name: Publish the verified roster to canonical main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/ycSummer2026.json
          git commit -m "Refresh Y Combinator class roster"
          git push origin HEAD:main
      - name: Deploy the exact canonical commit
        if: steps.changes.outputs.changed == 'true'
        run: npm run deploy:production
