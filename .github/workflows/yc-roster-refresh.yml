name: Refresh Y Combinator roster

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: yc-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Discover and enrich the official class roster
        run: npm run yc:update
      - name: Detect a material roster or profile change
        id: changes
        run: |
          if git diff --quiet -- app/data/ycSummer2026.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the changed release
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
      - name: Open or refresh a verified roster pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/yc-roster-refresh
          git add app/data/ycSummer2026.json
          git commit -m "Refresh Y Combinator class roster"
          git push --force origin HEAD:automation/yc-roster-refresh
          gh pr create --base main --head automation/yc-roster-refresh --title "Refresh Y Combinator class roster" --body "Automated official-directory discovery and profile refresh. Merge only after the required checks pass; canonical production deployment remains an explicit release step." || gh pr edit automation/yc-roster-refresh --title "Refresh Y Combinator class roster" --body "Automated official-directory discovery and profile refresh. Merge only after the required checks pass; canonical production deployment remains an explicit release step."
